name: Build REDREAM from Amethyst

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-amethyst-redream.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout REDREAM build configuration
        uses: actions/checkout@v4

      - name: Checkout Amethyst Android source
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          path: amethyst
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: amethyst/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Apply REDREAM branding and package ID
        working-directory: amethyst
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app_pojavlauncher/build.gradle")
          s = p.read_text()
          s = s.replace("org.angelauramc.amethyst", "com.redream.launcher")
          s = s.replace('"Amethyst (Debug)"', '"REDREAM (Debug)"')
          s = s.replace('"Amethyst"', '"REDREAM"')
          p.write_text(s)
          PY

      - name: Build Android launcher
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: REDREAM-Amethyst-debug
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
