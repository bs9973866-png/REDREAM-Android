name: Build REDREAM APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redream-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout REDREAM source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"

      - name: Apply REDREAM package and SDK configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app_pojavlauncher/build.gradle")
          s = p.read_text()
          s = s.replace("compileSdk = 37", """compileSdk {\n        version = release(36) {\n            minorApiLevel = 1\n        }\n    }""")
          s = s.replace('"amethyst-legacy-"', '"redream-"')
          p.write_text(s)
          PY

      - name: Build REDREAM debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug

      - name: Upload REDREAM APK
        uses: actions/upload-artifact@v4
        with:
          name: REDREAM-Android-debug
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
