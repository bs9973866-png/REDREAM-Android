name: Build REDREAM game engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-engine.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout REDREAM configuration
        uses: actions/checkout@v4

      - name: Checkout Android launcher engine
        uses: actions/checkout@v4
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: main
          path: engine
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager}" --licenses >/dev/null 2>&1 || true

      - name: Apply REDREAM branding
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^launcher_name=.*/launcher_name=REDREAM/' ZalithLauncher/gradle.properties
          sed -i 's/^launcher_app_name=.*/launcher_app_name=REDREAM (Unofficial Modified Version)/' ZalithLauncher/gradle.properties
          sed -i 's/^launcher_short_name=.*/launcher_short_name=REDREAM/' ZalithLauncher/gradle.properties
          sed -i 's#^url_home=.*#url_home=https://github.com/bs9973866-png/REDREAM-Android#' ZalithLauncher/gradle.properties
          printf '\nREDREAM build note: unofficial modified build based on ZalithLauncher2.\n' >> README.md
          echo "### REDREAM engine build" >> "$GITHUB_STEP_SUMMARY"
          echo "This APK is built from the upstream ZalithLauncher2/PojavLauncher engine with REDREAM app-name configuration. The custom REDREAM HTML interface and this engine are not integrated yet." >> "$GITHUB_STEP_SUMMARY"

      - name: Build bundled Java runtime components
        working-directory: engine
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p out
          ./gradlew --no-daemon jre_lwjgl3glfw:build

      - name: Build Android APK (arm64)
        working-directory: engine
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace ZalithLauncher:assembleDebug -Darch=arm64

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDREAM-engine-arm64-debug
          path: engine/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
